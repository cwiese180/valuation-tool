<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BRWA | Property Intelligence</title>
<style>
:root{font-family:Inter,Arial,sans-serif;color:#172235;background:#f3f5f8}*{box-sizing:border-box}body{margin:0}header{background:#14263e;color:#fff;padding:18px 28px;display:flex;align-items:center;justify-content:space-between}header b{font-size:21px}header span{color:#ff9c4b}header small{color:#cbd5e1}nav{display:flex;gap:8px;padding:14px 26px;background:white;border-bottom:1px solid #e2e8f0;flex-wrap:wrap}button{cursor:pointer;border:1px solid #d4dce7;background:#fff;border-radius:8px;padding:10px 14px;font-weight:600;color:#24354b}button.active,button.primary{background:#dc6c19;color:white;border-color:#dc6c19}button:hover{filter:brightness(.97)}main{max-width:1250px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}.card{background:white;border:1px solid #e0e6ef;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 2px 9px #1e293b08}.metric{font-size:28px;font-weight:750;margin:8px 0}.muted{color:#64748b;font-size:13px}.pill{display:inline-block;padding:5px 9px;background:#eaf0f7;border-radius:30px;font-size:12px}.verified{background:#dcfce7;color:#166534}.review{background:#fef3c7;color:#92400e}.indicative{background:#e2e8f0;color:#475569}h1{font-size:26px;margin:0 0 8px}h2{font-size:18px}input,select{border:1px solid #cbd5e1;padding:10px;border-radius:8px;width:100%;background:white;color:#172235}label{font-size:13px;font-weight:650;display:block;margin:10px 0 6px}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:13px 10px;border-bottom:1px solid #e2e8f0;text-align:left}th{color:#64748b}tr[data-id]{cursor:pointer}tr[data-id]:hover{background:#fff7ed}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.hidden{display:none}.callout{border-left:4px solid #dc6c19;background:#fff7ed;padding:14px;margin:12px 0}.right{text-align:right}@media(max-width:700px){.filters,.two{grid-template-columns:1fr}main{padding:14px}header{padding:16px}}
</style></head><body>
<header><div><b>BR<span>WA</span> Property Intelligence</b><div><small>Commercial property intelligence and valuation platform</small></div></div><small>DEMO · SYNTHETIC DATA</small></header>
<nav id="nav"><button class="active" data-view="dashboard">Overview</button><button data-view="properties">Property 360°</button><button data-view="evidence">Evidence Explorer</button><button data-view="review">Verification</button><button data-view="quotes">Valuation Quoting</button><button data-view="integrations">Integrations</button></nav>
<main><section id="dashboard"></section><section id="properties" class="hidden"></section><section id="evidence" class="hidden"></section><section id="review" class="hidden"></section><section id="quotes" class="hidden"></section><section id="integrations" class="hidden"></section></main>
<script>
"use strict";
const properties=[
{id:"PROP-001",address:"18 Example Road, Welshpool WA",type:"Industrial",area:4200,land:7000,source:"Cirrus8",rent:780000,wale:3.4,valuation:12500000},
{id:"PROP-002",address:"45 Sample Street, Osborne Park WA",type:"Industrial",area:1800,land:2800,source:"Salesforce",rent:385000,wale:4.2,valuation:6500000},
{id:"PROP-003",address:"100 Illustrative Terrace, Perth WA",type:"Office",area:3600,land:1300,source:"Valuations",rent:1460000,wale:2.8,valuation:18200000},
{id:"PROP-004",address:"22 Concept Street, Subiaco WA",type:"Retail",area:280,land:400,source:"External (demo)",rent:173600,wale:1.7,valuation:3400000}
];
const evidence=[
{id:"SALE-001",property:"PROP-001",kind:"Sale",date:"2026-09-18",amount:8500000,unit:"AUD",yield:6.1,status:"Verified",source:"Salesforce",note:"Fictional settled sale; verified status simulated"},
{id:"LEASE-001",property:"PROP-002",kind:"Lease",date:"2026-08-12",amount:245,unit:"AUD/sqm/year",yield:null,status:"Verified",source:"Cirrus8",note:"Fictional passing rental evidence"},
{id:"SALE-002",property:"PROP-003",kind:"Sale",date:"2026-07-22",amount:18200000,unit:"AUD",yield:7.25,status:"Review required",source:"Valuation report",note:"Illustrative extracted comparable, page 31"},
{id:"SALE-003",property:"PROP-001",kind:"Sale",date:"2026-06-14",amount:7200000,unit:"AUD",yield:5.8,status:"Review required",source:"Valuation report",note:"Illustrative second source, page 22"},
{id:"LEASE-002",property:"PROP-004",kind:"Lease",date:"2026-05-20",amount:620,unit:"AUD/sqm/year",yield:null,status:"Indicative",source:"External listing",note:"Fictional asking rent, not executed lease"}
];
const money=n=>new Intl.NumberFormat("en-AU",{style:"currency",currency:"AUD",maximumFractionDigits:0}).format(n);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const property=id=>properties.find(p=>p.id===id);
const badge=s=>'<span class="pill '+(s==="Verified"?"verified":s==="Review required"?"review":"indicative")+'">'+esc(s)+'</span>';
let currentProperty=properties[0].id;
function renderDashboard(){document.getElementById("dashboard").innerHTML='<h1>Portfolio intelligence</h1><p class="muted">Demonstration only. All addresses, financial values and transactions are fictional.</p><div class="grid">'+[['Properties',properties.length],['Sales evidence',evidence.filter(e=>e.kind==="Sale").length],['Leasing evidence',evidence.filter(e=>e.kind==="Lease").length],['Awaiting review',evidence.filter(e=>e.status==="Review required").length]].map(([k,v])=>'<div class="card"><div class="muted">'+k+'</div><div class="metric">'+v+'</div></div>').join('')+'</div><div class="card"><h2>Purpose</h2><p>Combine valuation documents, Cirrus8 property management, Salesforce agency deals and licensed external data into a traceable evidence platform.</p><div class="callout">No source systems are connected. This build contains no production data, AI extraction or persistent approvals.</div></div>'}
function renderProperties(){const p=property(currentProperty);const linked=evidence.filter(e=>e.property===p.id);document.getElementById("properties").innerHTML='<h1>Property 360°</h1><div class="card"><label>Choose property</label><select id="propertySelect">'+properties.map(x=>'<option value="'+x.id+'" '+(x.id===p.id?'selected':'')+'>'+esc(x.address)+'</option>').join('')+'</select></div><div class="grid">'+[['Asset class',p.type],['Building area',p.area.toLocaleString()+' sqm'],['Passing rent',money(p.rent)+' pa'],['WALE',p.wale+' years'],['Latest indicative valuation',money(p.valuation)],['Source',p.source]].map(([a,b])=>'<div class="card"><div class="muted">'+a+'</div><div class="metric" style="font-size:20px">'+esc(b)+'</div></div>').join('')+'</div><div class="card"><h2>Linked evidence</h2>'+linked.map(e=>'<p><b>'+e.id+'</b> · '+e.kind+' · '+(e.unit==="AUD"?money(e.amount):money(e.amount)+'/sqm pa')+' · '+badge(e.status)+' <span class="muted">'+esc(e.source)+'</span></p>').join('')+'</div>';document.getElementById("propertySelect").onchange=e=>{currentProperty=e.target.value;renderProperties()}}
function renderEvidence(){document.getElementById("evidence").innerHTML='<h1>Evidence Explorer</h1><div class="card filters"><div><label>Address / source / ID</label><input id="evSearch" placeholder="Search evidence"></div><div><label>Transaction type</label><select id="evType"><option>All</option><option>Sale</option><option>Lease</option></select></div><div><label>Verification</label><select id="evStatus"><option>All</option><option>Verified</option><option>Review required</option><option>Indicative</option></select></div></div><div class="card tablewrap"><table><thead><tr><th>Property</th><th>Type / date</th><th>Amount</th><th>Yield</th><th>Source</th><th>Status</th></tr></thead><tbody id="evRows"></tbody></table></div><div class="card"><h2>Selected evidence</h2><div id="evDetail" class="muted">Select a row to inspect source and provenance.</div></div>';["evSearch","evType","evStatus"].forEach(id=>document.getElementById(id).addEventListener("input",updateEvidence));updateEvidence()}
function updateEvidence(){const q=document.getElementById("evSearch").value.toLowerCase(),t=document.getElementById("evType").value,s=document.getElementById("evStatus").value;const list=evidence.filter(e=>(t==="All"||e.kind===t)&&(s==="All"||e.status===s)&&[e.id,property(e.property).address,e.source].join(" ").toLowerCase().includes(q));document.getElementById("evRows").innerHTML=list.map(e=>'<tr data-id="'+e.id+'"><td>'+esc(property(e.property).address)+'</td><td>'+e.kind+'<br><span class="muted">'+e.date+'</span></td><td>'+(e.unit==="AUD"?money(e.amount):money(e.amount)+'/sqm pa')+'</td><td>'+(e.yield===null?'—':e.yield+'%')+'</td><td>'+esc(e.source)+'</td><td>'+badge(e.status)+'</td></tr>').join('')||'<tr><td colspan="6">No matching records</td></tr>';document.querySelectorAll("#evRows tr[data-id]").forEach(row=>row.onclick=()=>{const e=evidence.find(x=>x.id===row.dataset.id);document.getElementById("evDetail").innerHTML='<b>'+e.id+'</b><p>'+esc(e.note)+'</p><p>Source: '+esc(e.source)+' · Property: '+esc(e.property)+'</p><p>Original source document links are not available in this synthetic prototype.</p>'})}
function renderReview(){const pending=evidence.filter(e=>e.status==="Review required");document.getElementById("review").innerHTML='<h1>Evidence verification</h1><p class="muted">Illustrative review queue; actions update in-memory demonstration data only.</p>'+pending.map(e=>'<div class="card"><b>'+e.id+'</b> '+badge(e.status)+'<p>'+esc(property(e.property).address)+' · '+esc(e.note)+'</p><button data-approve="'+e.id+'" class="primary">Simulate approval</button></div>').join('')+(pending.length?'':'<div class="card">No records awaiting review.</div>');document.querySelectorAll("[data-approve]").forEach(b=>b.onclick=()=>{evidence.find(e=>e.id===b.dataset.approve).status="Verified";renderReview()})}
function renderQuotes(){document.getElementById("quotes").innerHTML='<h1>Valuation fee quoting</h1><p class="muted">Illustrative rules, not BRWA approved rates.</p><div class="two"><div class="card"><label>Asset class</label><select id="qAsset"><option>Industrial</option><option>Office</option><option>Retail</option><option>Development</option><option>Specialised</option></select><label>Estimated property value (AUD)</label><input id="qValue" type="number" min="0" value="5000000"><label>Estimated valuer hours</label><input id="qHours" type="number" min="1" value="14"><label>Loaded hourly cost (AUD)</label><input id="qRate" type="number" min="0" value="125"><label>Complexity</label><select id="qComplex"><option value="1">Standard</option><option value="1.3">Complex</option><option value="1.7">Highly complex</option></select></div><div class="card"><h2>Indicative fee</h2><div class="metric" id="qFee"></div><p id="qCost"></p><p id="qMargin"></p><p id="qApproval"></p><div class="callout">Fee recommendation is a placeholder. Production pricing requires calibrated rates, scope, purpose, risk, minimum fees and management approvals.</div></div></div>';["qAsset","qValue","qHours","qRate","qComplex"].forEach(id=>document.getElementById(id).addEventListener("input",updateQuote));updateQuote()}
function updateQuote(){const a=document.getElementById("qAsset").value,v=Math.max(0,+document.getElementById("qValue").value||0),h=Math.max(1,+document.getElementById("qHours").value||1),r=Math.max(0,+document.getElementById("qRate").value||0),c=+document.getElementById("qComplex").value;const base={Industrial:1850,Office:2150,Retail:2050,Development:3200,Specialised:3700}[a];const fee=Math.round((base+Math.max(0,Math.log10(Math.max(100000,v)/100000))*280)*c/50)*50,cost=h*r,margin=fee?(fee-cost)/fee*100:0;document.getElementById("qFee").textContent=money(fee)+' + GST';document.getElementById("qCost").textContent='Estimated labour cost: '+money(cost);document.getElementById("qMargin").textContent='Contribution margin: '+margin.toFixed(1)+'%';document.getElementById("qApproval").textContent=margin<45||a==="Specialised"?'Manager approval recommended':'Within illustrative margin threshold'}
function renderIntegrations(){const items=[['Cirrus8 PM','Existing automated feed','Property, tenancy, lease, rent and expiry history'],['Salesforce S&L','Structured records','Opportunity, sale and leasing transaction mapping'],['Shared-drive valuations','Read-only crawler proposed','Report inventory, text/table extraction, evidence verification'],['External evidence','Licensed adapters proposed','Transaction, listing, cadastral and planning feeds']];document.getElementById("integrations").innerHTML='<h1>Source integrations</h1><p class="muted">Integration contracts defined in repository documentation. No live connections are configured.</p><div class="grid">'+items.map(x=>'<div class="card"><h2>'+x[0]+'</h2><span class="pill">'+x[1]+'</span><p>'+x[2]+'</p></div>').join('')+'</div>'}
function show(view){document.querySelectorAll("main section").forEach(x=>x.classList.toggle("hidden",x.id!==view));document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x.dataset.view===view))}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(b.dataset.view));renderDashboard();renderProperties();renderEvidence();renderReview();renderQuotes();renderIntegrations();
</script></body></html>
